<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Web 登录 · 羽毛球课堂原型</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="web-login">
  <div class="web-login-card">
    <div class="brand">
      <div class="mark">🏸</div>
      <div class="title">羽毛球课堂 · 管理后台</div>
      <div class="muted" style="margin-top:4px">深职大</div>
    </div>

    <div class="seg" id="seg-login" style="margin-bottom:16px">
      <button class="on" data-v="sms">手机验证码</button>
      <button data-v="pwd">账号密码</button>
    </div>

    <div id="login-sms">
      <div class="form-item"><label>手机号</label><input class="input" id="sms-phone" value="13988018801" placeholder="请输入手机号" /></div>
      <div class="form-item"><label>短信验证码</label>
        <div class="code-row">
          <input class="input" id="sms-code" value="102486" placeholder="6 位验证码" />
          <button class="btn line" type="button" onclick="toast('验证码已发送（演示）')">获取验证码</button>
        </div>
      </div>
      <button class="btn block square" onclick="doLogin('sms')">登录</button>
    </div>

    <div id="login-pwd" class="hidden">
      <div class="form-item"><label>账号</label><input class="input" id="pwd-account" value="wangjg" placeholder="手机号 / 工号" /></div>
      <div class="form-item"><label>密码</label><input class="input" id="pwd-pass" type="password" value="******" placeholder="请输入密码" /></div>
      <div class="between" style="margin-bottom:14px">
        <span class="muted">连续失败 5 次将临时锁定</span>
        <button class="muted" type="button" onclick="toast('请联系馆长重置密码')">忘记密码？</button>
      </div>
      <button class="btn block square" onclick="doLogin('pwd')">登录</button>
    </div>

    <div class="card" style="margin-top:16px;box-shadow:none;background:var(--bg)">
      <div class="muted">演示账号：馆长 王建国 · 角色权限由后台配置 · 正式环境建议开启双因素认证</div>
    </div>
    <p style="text-align:center;margin-top:16px"><a href="index.html" style="color:var(--primary-dark);text-decoration:none;font-size:13px">← 返回演示入口</a></p>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
  bindGroup('#seg-login', b => {
    document.getElementById('login-sms').classList.toggle('hidden', b.dataset.v !== 'sms');
    document.getElementById('login-pwd').classList.toggle('hidden', b.dataset.v !== 'pwd');
  });
  function doLogin(mode) {
    toast(mode === 'sms' ? '验证码校验通过，正在进入后台…' : '账号密码校验通过，正在进入后台…');
    setTimeout(() => { location.href = 'web-admin.html'; }, 600);
  }
</script>
</body>
</html>
